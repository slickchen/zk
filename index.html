<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>广州学校招生查询系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="app-header">
            <h1>📚 广州学校招生查询</h1>
            <div class="header-stats">
                <span id="data-count">加载中...</span>
            </div>
        </header>

        <!-- 搜索栏 -->
        <div class="search-section">
            <div class="search-type">
                <select id="search-type" class="search-select">
                    <option value="school">🏫 学校名称</option>
                    <option value="major">📖 专业/项目</option>
                    <option value="region">📍 区域</option>
                    <option value="type">🏷️ 学校类型</option>
                    <option value="batch">📦 批次</option>
                </select>
            </div>
            <div class="search-input-group">
                <input type="text" id="search-input" placeholder="请输入关键词..." class="search-input">
                <button id="search-btn" class="search-btn">🔍</button>
            </div>
        </div>

        <!-- 快捷筛选 -->
        <div class="filter-section">
            <div class="filter-row">
                <select id="batch-filter" class="filter-select">
                    <option value="all">📦 全部批次</option>
                </select>
                <select id="region-filter" class="filter-select">
                    <option value="all">📍 全部区域</option>
                </select>
            </div>
            <div class="filter-row">
                <select id="type-filter" class="filter-select">
                    <option value="all">🏷️ 全部类型</option>
                </select>
                <button id="reset-btn" class="reset-btn">🔄 重置</button>
            </div>
        </div>

        <!-- 导出按钮 -->
        <div class="export-section">
            <button id="export-current" class="export-btn current">📥 导出当前结果</button>
            <button id="export-all" class="export-btn all">📥 导出全部数据</button>
        </div>

        <!-- 统计信息 -->
        <div class="stats-bar">
            <span id="result-count">0 条记录</span>
            <span id="export-status" class="export-status"></span>
        </div>

        <!-- 标签页 -->
        <div class="tab-container">
            <div class="tab-header">
                <button class="tab-btn active" data-tab="result">📋 搜索结果</button>
                <button class="tab-btn" data-tab="detail">📄 学校详情</button>
                <button class="tab-btn" data-tab="stats">📊 统计信息</button>
            </div>

            <!-- 搜索结果标签页 -->
            <div id="tab-result" class="tab-content active">
                <div class="result-list" id="result-list">
                    <!-- 搜索结果将动态加载到这里 -->
                    <div class="loading">加载数据中...</div>
                </div>
            </div>

            <!-- 详情标签页 -->
            <div id="tab-detail" class="tab-content">
                <div class="detail-card" id="detail-card">
                    <div class="detail-placeholder">
                        👆 点击搜索结果中的学校查看详细信息
                    </div>
                </div>
            </div>

            <!-- 统计标签页 -->
            <div id="tab-stats" class="tab-content">
                <div class="stats-container" id="stats-container">
                    <div class="loading">加载统计信息中...</div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="result">📋 列表</button>
            <button class="nav-btn" data-tab="detail">📄 详情</button>
            <button class="nav-btn" data-tab="stats">📊 统计</button>
        </nav>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/data-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
