        }
        .filter-actions {

            gap: 10px;
            margin-left: auto;

            color: white;

            </div>
            <div class="filter-group">

            </div>
            <div class="filter-actions">

                <button class="btn btn-reset" id="resetBtn">重置</button>
            </div>
        </div>

        { name: '广州市番禺区职业技术学校(南校区)(普通班)', type: 'vocational', nature: 'public', batch: 4, minScore: 220, maxScore: 300, district: '番禺', tags: ['普通中职', '电子'], programs: ['电子技术', '电商', '物流'], fee: '3800/年' },

        // 技工学校
        { name: '广州市工贸技师学院', type: 'vocational', nature: 'public', batch: 1, minScore: 380, maxScore: 480, district: '增城', tags: ['技工', '技师学院'], programs: ['工业机器人', '计算机网络', '数控加工'], fee: '3600-4400/年' },
        { name: '广州市机电技师学院', type: 'vocational', nature: 'public', batch: 1, minScore: 350, maxScore: 450, district: '白云', tags: ['技工', '技师学院'], programs: ['机电一体化', '工业机器人', '无人机'], fee: '3600-4400/年' },
        { name: '广州市交通技师学院', type: 'vocational', nature: 'public', batch: 1, minScore: 360, maxScore: 460, district: '增城', tags: ['技工', '技师学院'], programs: ['新能源汽车', '飞机维修', '智能网联'], fee: '3600-4400/年' },
        { name: '广州白云工商技师学院', type: 'vocational', nature: 'private', batch: 4, minScore: 180, maxScore: 260, district: '白云', tags: ['民办技工'], programs: ['室内设计', '电子商务', '工业机器人'], fee: '15000/年' },
        { name: '广东岭南现代技师学院', type: 'vocational', nature: 'private', batch: 4, minScore: 200, maxScore: 280, district: '天河', tags: ['民办技工'], programs: ['护理', '中药', '电子商务'], fee: '16500/年' },
    ];

    // 计算统计数据
    function updateStats() {
        const high = schoolDatabase.filter(s => s.type === 'high').length;
        const voc = schoolDatabase.filter(s => s.type === 'vocational').length;
        const programs = schoolDatabase.reduce((acc, s) => acc + (s.programs ? s.programs.length : 1), 0);
        document.getElementById('totalSchools').innerText = schoolDatabase.length;
        document.getElementById('totalHigh').innerText = high;
        document.getElementById('totalVocational').innerText = voc;
        document.getElementById('totalPrograms').innerText = programs;
    }

    // 渲染学校卡片
    function renderSchools(filtered = schoolDatabase) {
        const grid = document.getElementById('schoolGrid');
        document.getElementById('resultCount').innerText = filtered.length + ' 所学校';

        if (filtered.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; background:white; border-radius:30px;">没有符合条件的学校，试试调整筛选条件</div>';
            return;
        }

        let html = '';
        filtered.forEach(s => {
            const natureClass = s.nature === 'public' ? 'badge-public' : 'badge-private';
            const natureText = s.nature === 'public' ? '公办' : '民办';
            
            html += `
            <div class="school-card">
                <div class="card-header">
                    <span class="school-name">${s.name}</span>
                    <span class="${natureClass}">${natureText}</span>
                </div>
                <div>
                    <span class="badge-batch">第${s.batch}批次</span>
                    <span style="margin-left:8px;">📍 ${s.district}</span>
                </div>
                <div class="school-detail">
                    <span>📊 ${s.minScore}-${s.maxScore}分</span>
                    <span>💰 ${s.fee}</span>
                </div>
                <div class="programs">
                    📚 ${Array.isArray(s.programs) ? s.programs.join(' · ') : s.programs}
                </div>
                ${s.requirement ? `<div class="requirement">⚠️ ${s.requirement}</div>` : ''}
                <div style="margin-top:5px;">${s.tags.map(t => `<span style="background:#e5ecf7; padding:2px 8px; border-radius:20px; font-size:0.7rem; margin-right:5px;">#${t}</span>`).join('')}</div>
            </div>`;
        });
        grid.innerHTML = html;
    }

    // 筛选逻辑
    function filterSchools() {
        const type = document.getElementById('filterType').value;
        const nature = document.getElementById('filterNature').value;
        const batch = document.getElementById('filterBatch').value;
        const min = parseFloat(document.getElementById('minScore').value) || 0;
        const max = parseFloat(document.getElementById('maxScore').value) || 1000;
        const keyword = document.getElementById('keyword').value.trim().toLowerCase();

        const filtered = schoolDatabase.filter(s => {
            if (type !== 'all' && s.type !== type) return false;
            if (nature !== 'all' && s.nature !== nature) return false;
            if (batch !== 'all' && s.batch != batch) return false;
            if (s.maxScore < min || s.minScore > max) return false;
            
            if (keyword) {
                const nameMatch = s.name.toLowerCase().includes(keyword);
                const programMatch = s.programs.some(p => p.toLowerCase().includes(keyword));
                const tagMatch = s.tags.some(t => t.toLowerCase().includes(keyword));
                return nameMatch || programMatch || tagMatch;
            }
            return true;
        });

        renderSchools(filtered);
    }

    // 重置筛选
    function resetFilters() {
        document.getElementById('filterType').value = 'all';
        document.getElementById('filterNature').value = 'all';
        document.getElementById('filterBatch').value = 'all';
        document.getElementById('minScore').value = '200';
        document.getElementById('maxScore').value = '750';
        document.getElementById('keyword').value = '';
        renderSchools(schoolDatabase);
    }

    // 事件绑定
    document.getElementById('filterBtn').addEventListener('click', filterSchools);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);

    // 初始化
    updateStats();
    renderSchools();
</script>
</body>
</html>
